# Generates the contribution-graph snake animation and publishes it to the `output` branch.
# The README does NOT embed it yet: add the image only after this workflow has run once
# and the `output` branch exists, otherwise the image 404s.
name: Generate snake animation
on:
  schedule:
    - cron: "0 0 * * *"        # daily
  workflow_dispatch:           # manual run from the Actions tab
permissions:
  contents: write              # required to push the generated files to the `output` branch
jobs:
  generate:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
