# Generates the contribution-graph snake animation and publishes it to the `output` branch.
# The README does NOT embed it yet: add the image only after this workflow has run once
# and the `output` branch exists, otherwise the image 404s.
name: Generate snake animation
on:
  schedule:
    - cron: "0 0 * * *"        # daily
  workflow_dispatch:           # manual run from the Actions tab
permissions:
  contents: read               # default for every job; only `publish` is elevated
concurrency:
  group: snake-animation
  cancel-in-progress: true     # a newer run supersedes an older one, so stale SVGs can't overwrite fresh ones
jobs:
  generate:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Upload generated SVGs
        uses: actions/upload-artifact@v4
        with:
          name: snake
          path: dist
          if-no-files-found: error
  publish:
    name: Publish to output branch
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # only this job can push to the `output` branch
    steps:
      - name: Download generated SVGs
        uses: actions/download-artifact@v4
        with:
          name: snake
          path: dist
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
