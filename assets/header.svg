<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" fill="none" role="img" aria-label="Babloo Kumar - Freelance AI Engineer, QA Automation Specialist and Full-Stack Developer available for hire">
  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="430" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="35%" stop-color="#F472B6"/>
      <stop offset="70%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="430 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Name -->
  <text x="430.0" y="58" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="44" font-weight="800" fill="url(#flow)" filter="url(#glow)" opacity="0.9">
    Babloo Kumar
    <animate attributeName="opacity" values="0;0.95" dur="1.1s" begin="0s" fill="freeze" calcMode="spline" keySplines=".2 0 0 1"/>
  </text>

  <!-- Rotating role lines -->
  <text x="430.0" y="112" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="22" font-weight="600" fill="url(#flow)" opacity="0">Freelance AI Engineer &amp; QA Automation Specialist<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0229;0.1771;0.2;1" dur="17.5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/></text>
  <text x="430.0" y="112" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="22" font-weight="600" fill="url(#flow)" opacity="0">Building RAG &amp; LLM Apps with LangChain + OpenAI<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.2229;0.3771;0.4;1" dur="17.5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/></text>
  <text x="430.0" y="112" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="22" font-weight="600" fill="url(#flow)" opacity="0">Playwright · Selenium · Cypress · Pytest Automation<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.4229;0.5771;0.6;1" dur="17.5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/></text>
  <text x="430.0" y="112" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="22" font-weight="600" fill="url(#flow)" opacity="0">Full-Stack · Next.js · FastAPI · PostgreSQL<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.6229;0.7771;0.8;1" dur="17.5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/></text>
  <text x="430.0" y="112" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace" font-size="22" font-weight="600" fill="url(#flow)" opacity="0">Available for Remote Freelance &amp; Contract Projects<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.8229;0.9771;1" dur="17.5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/></text>

  <!-- Blinking caret -->
  <rect x="427.0" y="124" width="14" height="3" rx="1.5" fill="url(#flow)">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
